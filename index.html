<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Әл-Фараби AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #languageMenu {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 360px;

      padding: 20px;
      box-sizing: border-box;

      background: rgba(0, 0, 0, 0.78);
      border-radius: 20px;

      color: white;
      text-align: center;

      display: none;
    }

    #languageMenu h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .langButton {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;

      border: none;
      border-radius: 12px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
    }

    #scanMessage {
      position: fixed;
      z-index: 9998;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);

      padding: 12px 20px;

      background: rgba(0,0,0,.7);
      color: white;

      border-radius: 30px;
      font-size: 15px;

      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="scanMessage">
    Наведите камеру на диплом
  </div>

  <div id="languageMenu">

    <h2>Тілді таңдаңыз / Выберите язык</h2>

    <button class="langButton" data-video="#videoKZ">
      🇰🇿 Қазақша
    </button>

    <button class="langButton" data-video="#videoRU">
      🇷🇺 Русский
    </button>

    <button class="langButton" data-video="#videoEN">
      🇬🇧 English
    </button>

  </div>


  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="videoKZ"
        src="./video/kaz_alpha.webm"
        preload="none"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="videoRU"
        src="./video/rus_alpha.webm"
        preload="none"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="videoEN"
        src="./video/eng_alpha.webm"
        preload="none"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-video
        id="hologram"
        position="0 0 0.1"
        width="1"
        height="1.7778"
        material="transparent: true; alphaTest: 0.01">
      </a-video>

    </a-entity>

  </a-scene>


<script>

const target = document.querySelector("#target");
const hologram = document.querySelector("#hologram");

const languageMenu = document.querySelector("#languageMenu");
const scanMessage = document.querySelector("#scanMessage");

let selectedVideo = null;


// Диплом найден

target.addEventListener("targetFound", () => {

    scanMessage.style.display = "none";

    if (!selectedVideo) {
        languageMenu.style.display = "block";
    }

});


// Диплом потерян

target.addEventListener("targetLost", () => {

    languageMenu.style.display = "none";
    scanMessage.style.display = "block";

    if (selectedVideo) {
        selectedVideo.pause();
    }

});


// Выбор языка

document.querySelectorAll(".langButton").forEach(button => {

    button.addEventListener("click", async () => {

        const selector = button.dataset.video;
        const video = document.querySelector(selector);

        // остановить остальные видео

        document.querySelectorAll("video").forEach(v => {
            v.pause();
            v.currentTime = 0;
        });


        selectedVideo = video;

        // назначить видео голограмме

        hologram.setAttribute("src", selector);

        languageMenu.style.display = "none";


        try {

            video.muted = false;
            await video.play();

        } catch (error) {

            console.error("Video play error:", error);

        }

    });

});

</script>

</body>
</html>
