<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Әл-Фараби AR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    /* ============================= */
    /* ГОЛОГРАММА                    */
    /* ============================= */

    #hologramVideo {

      position: fixed;

      z-index: 50;

      left: 0;
      top: 0;

      width: 300px;
      height: auto;

      object-fit: contain;

      pointer-events: none;

      display: none;

      /*
        Убираем чёрный фон MP4
      */

      mix-blend-mode: screen;

      /*
        Точка привязки —
        нижняя часть видео
      */

      transform-origin:
        center bottom;

      background:
        transparent;

      /*
        Оптимизация движения
      */

      will-change:
        transform,
        width,
        left,
        top;

    }


    /* ============================= */
    /* ПОДСКАЗКА                     */
    /* ============================= */

    #scanMessage {

  position: fixed;

  z-index: 100;

  left: 50%;
  bottom: 35px;

  transform: translateX(-50%);

  width: calc(100% - 40px);
  max-width: 420px;

  box-sizing: border-box;

  padding: 12px 18px;

  background: rgba(0, 0, 0, 0.7);

  color: white;

  border-radius: 20px;

  font-size: 14px;

  line-height: 1.4;

  text-align: center;

  white-space: normal;

}


    /* ============================= */
    /* МЕНЮ ЯЗЫКОВ                   */
    /* ============================= */

    #languageMenu {

      position: fixed;

      z-index: 101;

      left: 50%;
      bottom: 35px;

      transform:
        translateX(-50%);

      width:
        calc(100% - 40px);

      max-width:
        360px;

      padding:
        20px;

      box-sizing:
        border-box;

      background:
        rgba(0, 0, 0, 0.80);

      border-radius:
        20px;

      color:
        white;

      text-align:
        center;

      display:
        none;

    }


    #languageMenu h2 {

      margin:
        0 0 15px;

      font-size:
        20px;

    }


    .langButton {

      display:
        block;

      width:
        100%;

      padding:
        14px;

      margin-top:
        10px;

      border:
        none;

      border-radius:
        12px;

      background:
        white;

      color:
        black;

      font-size:
        17px;

      font-weight:
        600;

      cursor:
        pointer;

    }


    /* ============================= */
    /* СМЕНА ЯЗЫКА                   */
    /* ============================= */

    #changeLanguage {

      position:
        fixed;

      z-index:
        102;

      top:
        20px;

      right:
        20px;

      padding:
        10px 14px;

      border:
        none;

      border-radius:
        20px;

      background:
        rgba(0, 0, 0, 0.7);

      color:
        white;

      font-size:
        14px;

      display:
        none;

      cursor:
        pointer;

    }

  </style>

</head>


<body>


  <!-- ============================= -->
  <!-- ПОДСКАЗКА                     -->
  <!-- ============================= -->

  <div id="scanMessage">

    Камераны дипломға бағыттаңыз / Наведите камеру на диплом / Point the camera at the diploma

  </div>


  <!-- ============================= -->
  <!-- СМЕНА ЯЗЫКА                   -->
  <!-- ============================= -->

  <button id="changeLanguage">

    Тілді ауыстыру / Сменить язык / Change language

  </button>


  <!-- ============================= -->
  <!-- МЕНЮ                          -->
  <!-- ============================= -->

  <div id="languageMenu">

    <h2>

      Тілді таңдаңыз / Выберите язык / Selected language

    </h2>


    <button
      class="langButton"
      data-src="./video/kaz_hologram.mp4"
    >

      🇰🇿 Қазақша

    </button>


    <button
      class="langButton"
      data-src="./video/rus_hologram.mp4"
    >

      🇷🇺 Русский

    </button>


    <button
      class="langButton"
      data-src="./video/eng_hologram.mp4"
    >

      🇬🇧 English

    </button>

  </div>


  <!-- ============================= -->
  <!-- HTML VIDEO                    -->
  <!-- ============================= -->

  <video

    id="hologramVideo"

    playsinline

    webkit-playsinline

    preload="none"

  ></video>


  <!-- ============================= -->
  <!-- MINDAR                        -->
  <!-- ============================= -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      warmupTolerance: 3;
      missTolerance: 20;
      filterMinCF: 0.001;
      filterBeta: 1000;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    vr-mode-ui="
      enabled: false;
    "

    device-orientation-permission-ui="
      enabled: false;
    "

  >


    <!-- ============================= -->
    <!-- КАМЕРА                        -->
    <!-- ============================= -->

    <a-camera

      id="arCamera"

      position="0 0 0"

      look-controls="
        enabled: false;
      "

    ></a-camera>


    <!-- ============================= -->
    <!-- TARGET                        -->
    <!-- ============================= -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <!--
        Центральная точка диплома.

        Здесь находится точка,
        на которой "стоит"
        Әл-Фараби.
      -->

      <a-entity

        id="anchorPoint"

        position="
          0
          0
          0
        "

      ></a-entity>


      <!-- Левая точка диплома -->

      <a-entity

        id="leftPoint"

        position="
          -0.5
          0
          0
        "

      ></a-entity>


      <!-- Правая точка диплома -->

      <a-entity

        id="rightPoint"

        position="
          0.5
          0
          0
        "

      ></a-entity>


    </a-entity>


  </a-scene>


<script>


/* ========================================= */
/* ЭЛЕМЕНТЫ                                  */
/* ========================================= */


const target =
  document.querySelector("#target");


const anchorPoint =
  document.querySelector("#anchorPoint");


const leftPoint =
  document.querySelector("#leftPoint");


const rightPoint =
  document.querySelector("#rightPoint");


const cameraElement =
  document.querySelector("#arCamera");


const video =
  document.querySelector("#hologramVideo");


const languageMenu =
  document.querySelector("#languageMenu");


const scanMessage =
  document.querySelector("#scanMessage");


const changeLanguage =
  document.querySelector("#changeLanguage");



/* ========================================= */
/* СОСТОЯНИЕ                                 */
/* ========================================= */


let targetVisible =
  false;


let videoSelected =
  false;



/* ========================================= */
/* СГЛАЖИВАНИЕ                               */
/* ========================================= */


/*

  Чем МЕНЬШЕ число,
  тем плавнее движение.

  0.05 = очень плавно,
         но появляется задержка

  0.10 = хороший баланс

  0.20 = быстро реагирует,
         но больше дрожи

*/


const SMOOTHING =
  0.10;


let smoothX =
  null;


let smoothY =
  null;


let smoothWidth =
  null;



/* ========================================= */
/* TARGET FOUND                              */
/* ========================================= */


target.addEventListener(

  "targetFound",

  () => {


    targetVisible =
      true;


    scanMessage.style.display =
      "none";


    /*
      Сбрасываем сглаживание.

      Это важно, чтобы после
      повторного наведения
      голограмма сразу появилась
      на правильном месте,
      а не прилетала со старой позиции.
    */


    smoothX =
      null;


    smoothY =
      null;


    smoothWidth =
      null;


    if (!videoSelected) {


      languageMenu.style.display =
        "block";


    }


    else {


      languageMenu.style.display =
        "none";


      video.style.display =
        "block";


    }


  }

);



/* ========================================= */
/* TARGET LOST                               */
/* ========================================= */


target.addEventListener(

  "targetLost",

  () => {


    targetVisible =
      false;


    languageMenu.style.display =
      "none";


    scanMessage.style.display =
      "block";


    /*
      Видео НЕ останавливаем.

      Оно продолжает идти,
      даже если MindAR
      ненадолго потерял диплом.
    */


    video.style.display =
      "none";


  }

);



/* ========================================= */
/* ВЫБОР ЯЗЫКА                               */
/* ========================================= */


document
  .querySelectorAll(".langButton")
  .forEach(button => {


    button.addEventListener(

      "click",

      async () => {


        const source =
          button.dataset.src;


        video.pause();


        video.src =
          source;


        video.load();


        video.currentTime =
          0;


        videoSelected =
          true;


        /*
          Сбрасываем координаты
          перед новым видео.
        */


        smoothX =
          null;


        smoothY =
          null;


        smoothWidth =
          null;


        languageMenu.style.display =
          "none";


        changeLanguage.style.display =
          "block";


        video.style.display =
          "block";


        try {


          video.muted =
            false;


          await video.play();


        }


        catch(error) {


          console.error(

            "Video play error:",

            error

          );


        }


      }

    );


  });



/* ========================================= */
/* ВИДЕО ЗАКОНЧИЛОСЬ                         */
/* ========================================= */


video.addEventListener(

  "ended",

  () => {


    video.pause();


    video.currentTime =
      0;


    video.style.display =
      "none";


    videoSelected =
      false;


    changeLanguage.style.display =
      "none";


    smoothX =
      null;


    smoothY =
      null;


    smoothWidth =
      null;


    if (targetVisible) {


      languageMenu.style.display =
        "block";


      scanMessage.style.display =
        "none";


    }


    else {


      languageMenu.style.display =
        "none";


      scanMessage.style.display =
        "block";


    }


  }

);



/* ========================================= */
/* СМЕНА ЯЗЫКА                               */
/* ========================================= */


changeLanguage.addEventListener(

  "click",

  () => {


    video.pause();


    video.currentTime =
      0;


    video.style.display =
      "none";


    videoSelected =
      false;


    changeLanguage.style.display =
      "none";


    smoothX =
      null;


    smoothY =
      null;


    smoothWidth =
      null;


    if (targetVisible) {


      languageMenu.style.display =
        "block";


    }


  }

);



/* ========================================= */
/* THREE.JS ВЕКТОРЫ                          */
/* ========================================= */


const anchorWorld =
  new THREE.Vector3();


const leftWorld =
  new THREE.Vector3();


const rightWorld =
  new THREE.Vector3();


const anchorProjected =
  new THREE.Vector3();


const leftProjected =
  new THREE.Vector3();


const rightProjected =
  new THREE.Vector3();



/* ========================================= */
/* AR → SCREEN                               */
/* ========================================= */


function updateHologramPosition() {


  requestAnimationFrame(
    updateHologramPosition
  );


  /*
    Пока диплом не виден
    или видео не выбрано —
    ничего не делаем.
  */


  if (

    !targetVisible ||

    !videoSelected

  ) {

    return;

  }



  const camera =

    cameraElement.getObject3D(
      "camera"
    );


  if (!camera) {

    return;

  }



  /* ======================================= */
  /* ПОЛУЧАЕМ AR-КООРДИНАТЫ                  */
  /* ======================================= */


  anchorPoint
    .object3D
    .getWorldPosition(
      anchorWorld
    );


  leftPoint
    .object3D
    .getWorldPosition(
      leftWorld
    );


  rightPoint
    .object3D
    .getWorldPosition(
      rightWorld
    );



  /* ======================================= */
  /* ПРОЕКЦИЯ В КАМЕРУ                       */
  /* ======================================= */


  anchorProjected
    .copy(anchorWorld)
    .project(camera);


  leftProjected
    .copy(leftWorld)
    .project(camera);


  rightProjected
    .copy(rightWorld)
    .project(camera);



  /* ======================================= */
  /* КООРДИНАТЫ ЭКРАНА                       */
  /* ======================================= */


  const anchorX =

    (
      anchorProjected.x *
      0.5 +
      0.5
    )

    *

    window.innerWidth;



  const anchorY =

    (
      -anchorProjected.y *
      0.5 +
      0.5
    )

    *

    window.innerHeight;



  const leftX =

    (
      leftProjected.x *
      0.5 +
      0.5
    )

    *

    window.innerWidth;



  const leftY =

    (
      -leftProjected.y *
      0.5 +
      0.5
    )

    *

    window.innerHeight;



  const rightX =

    (
      rightProjected.x *
      0.5 +
      0.5
    )

    *

    window.innerWidth;



  const rightY =

    (
      -rightProjected.y *
      0.5 +
      0.5
    )

    *

    window.innerHeight;



  /* ======================================= */
  /* РАЗМЕР ДИПЛОМА НА ЭКРАНЕ                */
  /* ======================================= */


  const targetWidthPixels =

    Math.hypot(

      rightX - leftX,

      rightY - leftY

    );



  /* ======================================= */
  /* РАЗМЕР ӘЛЬ-ФАРАБИ                       */
  /* ======================================= */


  /*
    Ты выбрал 1.0.

    Поэтому оставляем:

    размер голограммы =
    ширина диплома × 1.0
  */


  const hologramWidth =

    targetWidthPixels *
    0.55;



  /* ======================================= */
  /* ПЕРВЫЙ КАДР                             */
  /* ======================================= */


  if (smoothX === null) {


    smoothX =
      anchorX;


    smoothY =
      anchorY;


    smoothWidth =
      hologramWidth;


  }



  /* ======================================= */
  /* ПЛАВНОЕ ДВИЖЕНИЕ                        */
  /* ======================================= */


  smoothX +=

    (
      anchorX -
      smoothX
    )

    *

    SMOOTHING;



  smoothY +=

    (
      anchorY -
      smoothY
    )

    *

    SMOOTHING;



  smoothWidth +=

    (
      hologramWidth -
      smoothWidth
    )

    *

    SMOOTHING;



  /* ======================================= */
  /* ПРИМЕНЯЕМ РАЗМЕР                        */
  /* ======================================= */


  video.style.width =

    smoothWidth +
    "px";



  /* ======================================= */
  /* ПРИМЕНЯЕМ ПОЗИЦИЮ                       */
  /* ======================================= */


  video.style.left =

    smoothX +
    "px";


  video.style.top =

    smoothY +
    "px";



  /*
    -50% по X:
    центрируем персонажа.

    -100% по Y:
    нижняя часть видео
    находится на дипломе.

    Поэтому Әл-Фараби
    визуально стоит на нём.
  */


  video.style.transform =

    "translate(-50%, -100%)";


  video.style.display =

    "block";


}



/* ========================================= */
/* ЗАПУСК                                    */
/* ========================================= */


updateHologramPosition();


</script>


</body>

</html>
