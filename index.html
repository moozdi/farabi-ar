<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>Әл-Фараби AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #scanMessage {
      position: fixed;
      z-index: 9998;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 30px;
      font-size: 15px;
      white-space: nowrap;
    }

    #languageMenu {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 360px;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      color: white;
      text-align: center;
      display: none;
    }

    #languageMenu h2 {
      margin: 0 0 15px;
      font-size: 20px;
    }

    .langButton {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #changeLanguage {
      position: fixed;
      z-index: 9999;
      top: 20px;
      right: 20px;
      padding: 10px 14px;
      border: none;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 14px;
      display: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="scanMessage">
    Наведите камеру на диплом
  </div>

  <button id="changeLanguage">
    Сменить язык
  </button>

  <div id="languageMenu">
    <h2>Тілді таңдаңыз / Выберите язык</h2>

    <button class="langButton" data-video="#videoKZ">
      🇰🇿 Қазақша
    </button>

    <button class="langButton" data-video="#videoRU">
      🇷🇺 Русский
    </button>

    <button class="langButton" data-video="#videoEN">
      🇬🇧 English
    </button>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      warmupTolerance: 3;
      missTolerance: 20;
      filterMinCF: 0.001;
      filterBeta: 1000;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>

      <video
        id="videoKZ"
        src="./video/kaz_hologram.mp4"
        preload="none"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <video
        id="videoRU"
        src="./video/rus_hologram.mp4"
        preload="none"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <video
        id="videoEN"
        src="./video/eng_hologram.mp4"
        preload="none"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <a-plane
        id="hologram"
        width="1"
        height="1.7778"
        position="0 0 0.1"
        visible="false"
      ></a-plane>

    </a-entity>

  </a-scene>

  <script>
    const target = document.querySelector("#target");
    const hologram = document.querySelector("#hologram");

    const languageMenu = document.querySelector("#languageMenu");
    const scanMessage = document.querySelector("#scanMessage");
    const changeLanguage = document.querySelector("#changeLanguage");

    let selectedVideo = null;
    let targetIsVisible = false;

    function stopAllVideos() {
      document.querySelectorAll("video").forEach(video => {
        video.pause();
        video.currentTime = 0;
      });
    }

    function clearHologramMaterial() {
      const mesh = hologram.getObject3D("mesh");

      if (mesh && mesh.material) {
        mesh.material.map = null;
        mesh.material.needsUpdate = true;
      }

      hologram.setAttribute("visible", "false");
    }

    function resetToLanguageMenu() {
      stopAllVideos();

      selectedVideo = null;

      clearHologramMaterial();

      changeLanguage.style.display = "none";

      if (targetIsVisible) {
        scanMessage.style.display = "none";
        languageMenu.style.display = "block";
      } else {
        languageMenu.style.display = "none";
        scanMessage.style.display = "block";
      }
    }

    function applyVideoToHologram(video) {
      const mesh = hologram.getObject3D("mesh");

      if (!mesh) {
        console.error("Hologram mesh not found");
        return;
      }

      const texture = new THREE.VideoTexture(video);

      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBAFormat;

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      mesh.material = material;
      mesh.material.needsUpdate = true;

      hologram.setAttribute("visible", "true");
    }

    target.addEventListener("targetFound", () => {
      targetIsVisible = true;

      scanMessage.style.display = "none";

      if (!selectedVideo) {
        languageMenu.style.display = "block";
      } else {
        languageMenu.style.display = "none";
        hologram.setAttribute("visible", "true");
      }
    });

    target.addEventListener("targetLost", () => {
      targetIsVisible = false;

      languageMenu.style.display = "none";
      scanMessage.style.display = "block";

      /*
        Видео специально НЕ останавливаем.
        Если MindAR ненадолго потерял диплом,
        воспроизведение продолжается.
      */
    });

    document.querySelectorAll(".langButton").forEach(button => {
      button.addEventListener("click", async () => {
        const selector = button.dataset.video;
        const video = document.querySelector(selector);

        stopAllVideos();

        selectedVideo = video;

        languageMenu.style.display = "none";
        changeLanguage.style.display = "block";

        applyVideoToHologram(video);

        try {
          video.muted = false;
          video.currentTime = 0;

          await video.play();
        } catch (error) {
          console.error("Video play error:", error);
        }
      });
    });

    document.querySelectorAll("video").forEach(video => {
      video.addEventListener("ended", () => {
        resetToLanguageMenu();
      });
    });

    changeLanguage.addEventListener("click", () => {
      resetToLanguageMenu();
    });
  </script>

</body>
</html>
